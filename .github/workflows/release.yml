name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version = .*/version = \"$VERSION\"/" Cargo.toml
      - run: sudo apt-get install -y protobuf-compiler
      - run: cargo test --features std
      - run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-python:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version = .*/version = \"$VERSION\"/" python/pyproject.toml
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The same gate the Python workflow applies on every push, repeated here:
      # PyPI has no unpublish, so the upload below must not be the first time
      # the tests are run against what is being shipped.
      - run: pip install -e "python/.[diagram,dev]"
      - run: pytest python/tests/ -v
      - run: mypy python/src/execution_trace
      - run: pip install build
      - run: python -m build python/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
