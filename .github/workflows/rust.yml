name: Rust

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - run: cargo test --features std
      - run: cargo clippy --features std -- -D warnings
      - run: cargo fmt --check
